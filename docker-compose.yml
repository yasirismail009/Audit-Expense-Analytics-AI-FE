services:
  # Development service
  analytics-fe-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    platform: linux/amd64
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    profiles:
      - dev

  # Production service
  analytics-fe-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    platform: linux/amd64
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    profiles:
      - prod

  # Production service with custom port
  analytics-fe-prod-custom:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    platform: linux/amd64
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    profiles:
      - prod-custom

networks:
  default:
    name: analytics-fe-network
